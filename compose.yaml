name: playnex

x-node: &node
  build:
    context: .
    dockerfile: infrastructure/docker/web.dev.Dockerfile
  image: playnex/web-dev
  env_file:
    - path: .env
      required: false
  volumes: &node-volumes
    - .:/workspace
    - node_modules_root:/workspace/node_modules
    - node_modules_web:/workspace/apps/web/node_modules
    - node_modules_ui:/workspace/packages/ui/node_modules
    - node_modules_design_tokens:/workspace/packages/design-tokens/node_modules
    - node_modules_shared_types:/workspace/packages/shared-types/node_modules
    - node_modules_config:/workspace/packages/config/node_modules
    - node_modules_game_sdk:/workspace/packages/game-sdk/node_modules
    - node_modules_game_snake_rush:/workspace/games/2d/snake-rush/node_modules
    - node_modules_game_2048_fusion:/workspace/games/2d/2048-fusion/node_modules
    - node_modules_game_memory_flip:/workspace/games/2d/memory-flip/node_modules
    - node_modules_game_tugla_tugla:/workspace/games/2d/tugla-tugla/node_modules
    - node_modules_game_connect_four:/workspace/games/2d/connect-four/node_modules
    - node_modules_game_air_hockey:/workspace/games/2d/air-hockey/node_modules
    - node_modules_game_chess_arena:/workspace/games/2d/chess-arena/node_modules
    - node_modules_game_trivia_battle:/workspace/games/2d/trivia-battle/node_modules
    - node_modules_game_drawing_party:/workspace/games/2d/drawing-party/node_modules
    - node_modules_game_neon_kart_racing:/workspace/games/3d/neon-kart-racing/node_modules
    - node_modules_game_siper:/workspace/games/3d/siper/node_modules
    - next_cache:/workspace/apps/web/.next

x-rust: &rust
  build:
    context: .
    dockerfile: infrastructure/docker/rust.dev.Dockerfile
  image: playnex/rust-dev
  env_file:
    - path: .env
      required: false

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 90s

x-rust-healthcheck: &rust-healthcheck
  interval: 10s
  timeout: 5s
  retries: 60
  # The first compile of the workspace takes minutes on a cold target volume.
  start_period: 600s

services:
  # One-shot: installs JS dependencies and builds design tokens once, so web and
  # storybook never race each other inside the shared node_modules volumes.
  deps:
    <<: *node
    command: sh -c "pnpm install && pnpm turbo run build --filter=@playnex/design-tokens"

  web:
    <<: *node
    command: pnpm turbo run dev --filter=@playnex/web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - '${WEB_PORT:-4310}:3000'
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  storybook:
    <<: *node
    command: pnpm turbo run storybook --filter=@playnex/ui
    ports:
      - '6006:6006'
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:6006/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  api:
    <<: *rust
    command: >-
      cargo watch --poll -w apps/api -w crates -w Cargo.toml -w Cargo.lock
      -w infrastructure/migrations -w games/3d/siper/data -x "run -p playnex-api"
    environment:
      PORT: 8080
      REALTIME_ACCOUNT_SECRET: ${REALTIME_ACCOUNT_SECRET:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-playnex}:${POSTGRES_PASSWORD:-playnex}@postgres:5432/${POSTGRES_DB:-playnex}
      MAILER_URL: http://mailer:8082
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: 4
      RUST_LOG: info
    ports:
      - '8080:8080'
    volumes:
      - .:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target_api:/cargo-target
    depends_on:
      postgres:
        condition: service_healthy
      mailer:
        condition: service_healthy
    healthcheck:
      <<: *rust-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']

  mailer:
    <<: *rust
    command: >-
      cargo watch --poll -w apps/mailer -w crates -w Cargo.toml -w Cargo.lock
      -x "run -p playnex-mailer"
    environment:
      PORT: 8082
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURITY: none
      MAIL_FROM: ${MAIL_FROM:-PLAYNEX <no-reply@playnex.localhost>}
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: 4
      RUST_LOG: info
    volumes:
      - .:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target_mailer:/cargo-target
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *rust-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8082/health']

  realtime:
    <<: *rust
    command: >-
      cargo watch --poll -w apps/realtime -w crates -w Cargo.toml -w Cargo.lock
      -w games/2d/air-hockey/data -w games/2d/trivia-battle/data
      -w games/2d/drawing-party/data -w games/3d/neon-kart-racing/data
      -w games/3d/siper/data
      -x "run -p playnex-realtime"
    environment:
      PORT: 8081
      CARGO_TARGET_DIR: /cargo-target
      CARGO_BUILD_JOBS: 4
      RUST_LOG: info
      REALTIME_TOKEN_SECRET: ${REALTIME_TOKEN_SECRET:-}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-4310},http://web:3000}
      REALTIME_ACCOUNT_SECRET: ${REALTIME_ACCOUNT_SECRET:-}
      API_INTERNAL_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      - '8081:8081'
    volumes:
      - .:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target_realtime:/cargo-target
    healthcheck:
      <<: *rust-healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8081/health']

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playnex}
      POSTGRES_DB: ${POSTGRES_DB:-playnex}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.0.6-alpine
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 compatible local object storage. MinIO stopped publishing container images in late 2025,
  # so the dev stack uses RustFS, which speaks the same API and env-var conventions.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-playnex}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-playnex-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  # Screenshot and e2e runner. Not part of `make up`; run with `make screenshots`.
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles:
      - tools
    init: true
    ipc: host
    working_dir: /workspace/apps/web
    command: node_modules/.bin/playwright test
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      PLAYWRIGHT_REALTIME_UPSTREAM: realtime:8081
      PLAYWRIGHT_MAILPIT_URL: http://mailpit:8025
    volumes: *node-volumes
    depends_on:
      web:
        condition: service_healthy

volumes:
  node_modules_root:
  node_modules_web:
  node_modules_ui:
  node_modules_design_tokens:
  node_modules_shared_types:
  node_modules_config:
  node_modules_game_sdk:
  node_modules_game_snake_rush:
  node_modules_game_2048_fusion:
  node_modules_game_memory_flip:
  node_modules_game_tugla_tugla:
  node_modules_game_connect_four:
  node_modules_game_air_hockey:
  node_modules_game_chess_arena:
  node_modules_game_trivia_battle:
  node_modules_game_drawing_party:
  node_modules_game_neon_kart_racing:
  node_modules_game_siper:
  next_cache:
  cargo_registry:
  cargo_target_api:
  cargo_target_mailer:
  cargo_target_realtime:
  postgres_data:
  valkey_data:
  storage_data:
