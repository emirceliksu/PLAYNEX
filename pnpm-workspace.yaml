packages:
  - apps/web
  - packages/*
  - games/2d/*

# Store lives inside the root node_modules volume so pnpm can hardlink instead of copying
# across Docker volumes.
storeDir: node_modules/.pnpm-store
autoInstallPeers: true

# Native binaries that ship a postinstall step; everything else is denied build scripts.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# pnpm holds back releases younger than its minimum age; these pins are deliberate.
minimumReleaseAgeExclude:
  - '@storybook/addon-a11y@10.6.3'
  - '@storybook/addon-docs@10.6.3'
  - '@storybook/addon-themes@10.6.3'
  - '@storybook/builder-vite@10.6.3'
  - '@storybook/react-dom-shim@10.6.3'
  - '@storybook/react-vite@10.6.3'
  - '@storybook/react@10.6.3'
  - lucide-react@1.60.0
  - storybook@10.6.3
