[package]
name = "playnex-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
axum.workspace = true
base64 = "0.23.1"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring", "hostname"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.29.0", features = ["v7", "serde"] }
