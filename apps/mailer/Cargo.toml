[package]
name = "playnex-mailer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64 = "0.23.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring", "hostname"] }
playnex-service = { path = "../../crates/service" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
tokio.workspace = true
tracing.workspace = true
