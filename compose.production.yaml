# Production stack for Coolify (Docker Compose build pack). Local development uses compose.yaml.
#
# Only `edge` is routed by the Coolify proxy; it is the single way in. web, api, realtime and
# postgres share the `internal` network, which Docker marks internal: no route to the outside
# world and no published ports; edge alone publishes EDGE_PORT on the host. Only the mailer has
# a route out (`egress`, for the Gmail API); the api reaches it over `mail`, a second internal
# network that web and realtime are not on, so the delivery key never shares a container with
# the database credentials.
# Setup and the variables to fill in Coolify: docs/deployment/coolify.md.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  edge:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/edge.Dockerfile
    environment:
      # Coolify routes the domain assigned to this service (https://playnex.meccode.com) to port 8080.
      - SERVICE_URL_EDGE_8080
    # Loopback only: the host's own proxy reaches it, the outside world does not. 3000-3002 are
    # already taken on the deployment host; override with EDGE_PORT if 4310 is too.
    ports:
      - '127.0.0.1:${EDGE_PORT:-4310}:8080'
    read_only: true
    tmpfs:
      - /data
      - /config
    networks:
      - public
      - internal
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/rust.Dockerfile
      args:
        PACKAGE: playnex-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/playnex
      MAILER_URL: http://mailer:8082
      # Comma-separated; verified accounts with these addresses become admins.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REALTIME_ACCOUNT_SECRET: ${SERVICE_PASSWORD_64_REALTIMEACCOUNT}
      INTERNAL_API_TOKEN: ${SERVICE_PASSWORD_64_INTERNALAPI}
      RUST_LOG: info
    read_only: true
    networks:
      - internal
      - mail
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailer:
        condition: service_healthy

  mailer:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/rust.Dockerfile
      args:
        PACKAGE: playnex-mailer
    environment:
      PORT: 8082
      # Gmail API through a service account with domain-wide delegation for gmail.send;
      # the From address is the Workspace user it sends as.
      GMAIL_SERVICE_ACCOUNT: ${GMAIL_SERVICE_ACCOUNT:?GMAIL_SERVICE_ACCOUNT must be set in Coolify}
      MAIL_FROM: PLAYNEX <playnex@meccode.com>
      RUST_LOG: info
    read_only: true
    networks:
      - mail
      - egress
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8082/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  realtime:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/rust.Dockerfile
      args:
        PACKAGE: playnex-realtime
    environment:
      PORT: 8081
      REALTIME_TOKEN_SECRET: ${SERVICE_PASSWORD_64_REALTIME}
      # Account tickets from the api and match results back to it; both sides share these two.
      REALTIME_ACCOUNT_SECRET: ${SERVICE_PASSWORD_64_REALTIMEACCOUNT}
      API_INTERNAL_URL: http://api:8080
      INTERNAL_API_TOKEN: ${SERVICE_PASSWORD_64_INTERNALAPI}
      REALTIME_ALLOWED_ORIGINS: https://playnex.meccode.com
      RUST_LOG: info
    read_only: true
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8081/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: playnex
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 20s
      retries: 10

networks:
  public: {}
  internal:
    internal: true
  mail:
    internal: true
  egress: {}

volumes:
  postgres-data:
